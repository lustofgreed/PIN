<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get your link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07041a;--pink:#ff2d9b;--cyan:#22e4ff;--lime:#b6ff3b;--gold:#ffb627;--violet:#7a3cff;--ink:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;overflow:hidden;display:grid;place-items:center;min-height:100vh}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.g1{width:46vmax;height:46vmax;background:var(--violet);top:-15vmax;left:-12vmax}
.g2{width:38vmax;height:38vmax;background:var(--pink);bottom:-14vmax;right:-8vmax;animation-delay:-5s}
.g3{width:26vmax;height:26vmax;background:var(--cyan);top:35%;left:55%;opacity:.3;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.grid{position:fixed;inset:auto 0 0 0;height:55vh;background:
linear-gradient(transparent,var(--bg) 85%),
repeating-linear-gradient(90deg,rgba(34,228,255,.35) 0 1px,transparent 1px 70px),
repeating-linear-gradient(0deg,rgba(255,45,155,.35) 0 1px,transparent 1px 70px);
transform:perspective(500px) rotateX(62deg);transform-origin:bottom;opacity:.55;animation:run 3s linear infinite}
@keyframes run{to{background-position:0 0,0 0,0 70px}}
.scene{position:fixed;inset:0;perspective:900px;pointer-events:none}
.cube{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:spin var(--t) linear infinite;left:var(--x);top:var(--y)}
.cube i{position:absolute;inset:0;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 24px var(--c),inset 0 0 24px color-mix(in srgb,var(--c) 40%,transparent)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes spin{from{transform:rotateX(0) rotateY(0) rotateZ(0)}to{transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg)}}
.ring{position:absolute;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 30px var(--c);width:var(--s);height:var(--s);left:var(--x);top:var(--y);animation:flip var(--t) linear infinite}
@keyframes flip{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
main{position:relative;z-index:2;perspective:1100px;width:min(92vw,560px)}
.card{transform-style:preserve-3d;transition:transform .15s ease-out;padding:clamp(28px,6vw,52px);border-radius:28px;text-align:center;
background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 80px rgba(122,60,255,.35)}
.card>*{transform:translateZ(40px)}
h1{font-family:'Unbounded',system-ui,sans-serif;font-weight:800;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.02em;
background:linear-gradient(90deg,var(--cyan),var(--lime),var(--gold),var(--pink),var(--cyan));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
p.sub{margin:16px auto 28px;max-width:34ch;color:rgba(255,255,255,.82);font-size:1.05rem;line-height:1.5}
form{display:grid;gap:14px}
input{width:100%;padding:18px 20px;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(7,4,26,.65);color:#fff;font:500 1.05rem 'Outfit',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:rgba(255,255,255,.5)}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,228,255,.25),0 0 30px rgba(34,228,255,.45)}
button{position:relative;padding:18px;border:0;border-radius:16px;cursor:pointer;color:#14041f;font:800 1.05rem 'Unbounded',sans-serif;
background:linear-gradient(90deg,var(--gold),var(--pink),var(--violet),var(--cyan));background-size:300% 100%;animation:flow 5s linear infinite;
box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 40px rgba(255,45,155,.6);transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-3px)}
button:active{transform:translateY(7px);box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 30px rgba(255,45,155,.6)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button[disabled]{opacity:.8;cursor:wait}
.msg{min-height:1.4em;font-size:.95rem;color:var(--lime)}
.msg.err{color:#ff7a9c}
p.sub{margin-bottom:14px}
.promise{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 auto 24px;font-size:.95rem;color:var(--lime)}
.trust{display:grid;gap:10px;justify-items:center;margin-top:22px;font-size:.95rem;color:rgba(255,255,255,.8)}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border-radius:99px;font:600 .85rem 'Unbounded',sans-serif;color:var(--lime);border:1px solid var(--lime);background:rgba(182,255,59,.1);box-shadow:0 0 22px rgba(182,255,59,.35)}
.count b{color:var(--gold);font-size:1.1em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="grid"></div>
<div class="scene" aria-hidden="true">
  <div class="cube" style="--s:90px;--x:10%;--y:18%;--t:18s;--c:#22e4ff"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cube" style="--s:60px;--x:82%;--y:14%;--t:12s;--c:#ff2d9b"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cube" style="--s:120px;--x:76%;--y:64%;--t:24s;--c:#b6ff3b"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cube" style="--s:70px;--x:14%;--y:68%;--t:15s;--c:#ffb627"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ring" style="--s:200px;--x:2%;--y:38%;--t:9s;--c:#7a3cff"></div>
  <div class="ring" style="--s:150px;--x:84%;--y:36%;--t:7s;--c:#22e4ff"></div>
</div>
<main>
  <div class="card" id="card">
    <h1 id="headline">Unlock your free link</h1>
    <p class="sub" id="sub">Enter your email and the product name you need. We will personally send you your personalized link.</p>
    <p class="promise"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.6-4.6 1.4 1.4-6 6Z"/></svg>We never send promotional emails, ever. Guaranteed.</p>
    <form id="f" novalidate>
      <input id="product" type="text" name="product" placeholder="Product name you need" autocomplete="off" required aria-label="Product name">
      <input id="email" type="email" name="email" placeholder="you@email.com" autocomplete="email" required aria-label="Your email">
      <button id="btn" type="submit">Submit</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <div class="trust">
      <span class="badge"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="m12 1 3 2.3 3.8-.1 1.2 3.6 3 2.3-1.2 3.6 1.2 3.6-3 2.3-1.2 3.6-3.8-.1L12 23l-3-2.3-3.8.1L4 17.2l-3-2.3 1.2-3.6L1 7.7l3-2.3L5.2 1.8 9 1.9 12 1Zm-1.2 14.4 5.6-5.6-1.4-1.4-4.2 4.2-1.8-1.8-1.4 1.4 3.2 3.2Z"/></svg>100% Real &amp; Trusted</span>
      <span class="count">Already <b>3,500+</b> people trust our service and have benefited.</span>
    </div>
  </div>
</main>
<script>
/* ====== EDIT THESE 4 LINES ====== */
const SHEET_URL    = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
const REDIRECT_URL = "https://YOUR-LINK-HERE.com";
const HEADLINE     = "Unlock your free link";
const BUTTON_TEXT  = "Submit";
/* ================================ */
const $=id=>document.getElementById(id);
$("headline").textContent=HEADLINE;$("btn").textContent=BUTTON_TEXT;

// 3D tilt follows the pointer
const card=$("card");
addEventListener("pointermove",e=>{
  const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
  card.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg)`;
});
addEventListener("pointerleave",()=>card.style.transform="");

// Email -> Google Sheet -> redirect
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const email=$("email").value.trim(),product=$("product").value.trim(),msg=$("msg");
  if(!product){msg.className="msg err";msg.textContent="Type the product name you need";return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    msg.className="msg err";msg.textContent="Enter a valid email, like name@gmail.com";return;
  }
  $("btn").disabled=true;msg.className="msg";msg.textContent="Saving... taking you there";
  const go=()=>{location.href=REDIRECT_URL};
  const timer=setTimeout(go,3000);
  try{
    await fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:new URLSearchParams({email,product,source:document.referrer||"direct"})});
  }catch(err){}
  clearTimeout(timer);go();
});
</script>
</body>
</html>
